<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- LIVE WALLPAPER (two layers for crossfade) -->
    <div class="wallpaper">
      <video class="wp-layer is-active" id="videoA" muted loop playsinline preload="auto"></video>
      <video class="wp-layer" id="videoB" muted loop playsinline preload="auto"></video>
      <!-- custom backgrounds: an uploaded image, or a solid colour / gradient -->
      <img class="wp-image" id="wpImage" alt="" />
      <div class="wp-fill" id="wpFill"></div>
      <div class="wp-veil"></div>
    </div>

    <!-- TOP LEFT: clock + weather -->
    <header class="clock">
      <div class="clock-main">
        <div class="clock-time" translate="no"><span id="time">--:--</span><span class="meridiem" id="meridiem">AM</span></div>
        <div class="clock-date" id="date"></div>
      </div>
      <button type="button" class="weather" id="weather" aria-label="Weather. Click to set your city">
        <svg class="trace" aria-hidden="true"><rect class="trace-line" pathLength="100"/></svg>
        <span class="weather-icon" id="weatherIcon" aria-hidden="true"></span>
        <span class="weather-temp" id="weatherTemp">--&deg;</span>
        <span class="weather-meta">
          <span class="weather-city" id="weatherCity">Weather</span>
          <span class="weather-cond" id="weatherCond">Locating&hellip;</span>
        </span>
      </button>
    </header>

    <!-- LEFT: workspace rail + launcher panel -->
    <nav class="rail" id="rail" aria-label="Workspaces"></nav>
    <section class="launcher" id="launcher" aria-label="Shortcuts">
      <div class="launcher-body">
        <svg class="trace" aria-hidden="true"><rect class="trace-line" pathLength="100"/></svg>
        <div class="launcher-head">
          <div class="launcher-tabs" id="launcherTabs" role="tablist" aria-label="Sections"></div>
          <div class="launcher-tools" id="launcherTools"></div>
        </div>
        <div class="launcher-grid" id="launcherGrid"></div>
        <div class="launcher-trash" id="launcherTrash" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 12h9l1-12M10 11v5M14 11v5"/></svg>
          <span>Drop here to remove</span>
        </div>
      </div>
      <span class="orb orb-a" aria-hidden="true"></span>
      <span class="orb orb-b" aria-hidden="true"></span>
      <span class="orb orb-c" aria-hidden="true"></span>
    </section>

    <!-- BOTTOM CENTER: search -->
    <form class="search" id="search" autocomplete="off">
      <svg class="trace" aria-hidden="true"><rect class="trace-line" pathLength="100"/></svg>
      <!-- engine picker: shows the engine the next search goes to -->
      <button type="button" class="search-engine" id="searchEngine" aria-haspopup="menu" aria-expanded="false" aria-label="Search engine: Google">
        <span class="search-engine-icon" id="searchEngineIcon" aria-hidden="true"></span>
        <svg class="search-engine-caret" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <input id="q" type="text" placeholder="Search Google..." aria-label="Search Google" />
      <!-- voice typing (Customize > Language) -->
      <button type="button" class="search-hist search-mic" id="searchMic" aria-pressed="false" aria-label="Search by voice" title="Search by voice" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      </button>
      <!-- search history lives in its own panel, never under the field -->
      <button type="button" class="search-hist" id="searchHist" aria-haspopup="dialog" aria-expanded="false" aria-label="Search history" title="Search history">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.2h3.2"/><path d="M12 8.2V12l2.6 1.7"/></svg>
      </button>
      <button type="submit" class="search-go" aria-label="Search">↵</button>
    </form>
    <!-- search bar pop-ups (outside the bar, so its blur doesn't clip them) -->
    <div class="sx-menu" id="engineMenu" role="menu" aria-label="Search engines" hidden></div>
    <div class="sx-hist" id="histPanel" role="dialog" aria-label="Search history" hidden></div>

    <!-- NOW PLAYING (bottom left, above the wallpaper toggle) -->
    <section class="media" id="media" aria-label="Now playing" hidden>
      <button type="button" class="media-top" id="mediaOpen">
        <span class="media-art">
          <img id="mediaImg" alt="" hidden />
          <span class="media-art-fallback" aria-hidden="true">&#9835;</span>
        </span>
        <span class="media-meta">
          <span class="media-title" id="mediaTitle"></span>
          <span class="media-artist" id="mediaArtist"></span>
        </span>
        <span class="media-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <div class="media-bar" id="mediaBar"><span class="media-fill" id="mediaFill"></span></div>
      <div class="media-row">
        <span class="media-time" id="mediaCur">0:00</span>
        <div class="media-ctrls">
          <button type="button" class="media-btn" id="mediaPrev" aria-label="Previous">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6 5h2.2v14H6zM19.5 5.4v13.2L9.6 12z"/></svg>
          </button>
          <button type="button" class="media-btn is-main" id="mediaToggle" aria-label="Pause">
            <svg class="i-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/></svg>
            <svg class="i-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>
          </button>
          <button type="button" class="media-btn" id="mediaNext" aria-label="Next">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M15.8 5H18v14h-2.2zM4.5 5.4v13.2l9.9-6.6z"/></svg>
          </button>
        </div>
        <span class="media-time" id="mediaDur">0:00</span>
      </div>
    </section>

    <!-- ZEN CLOCK (zen.js) + MINIMAL MODE (minimal.js), bottom left -->
    <div class="wp-control corner-pair" id="wpControl" role="toolbar" aria-label="Zen clock and minimal mode">
      <button type="button" class="ai-bubble qt-bubble corner-bubble" id="zenBtn" data-label="Zen clock" aria-label="Zen clock" title="Zen clock (Z)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path class="zen-hand" d="M12 7.5V12l3 2"/></svg>
      </button>
      <button type="button" class="ai-bubble qt-bubble corner-bubble" id="minBtn" data-label="Minimal" aria-pressed="false" aria-label="Minimal mode" title="Minimal mode (M) · right-click for settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="M9 12h6"/></svg>
      </button>
    </div>

    <!-- QUICK PEEK -->
    <div class="peek" id="peek">
      <button class="peek-toggle" id="peekToggle">Quick Peek</button>
      <div class="peek-panel" id="peekPanel" hidden></div>
    </div>

    <!-- UNDO NOTE (after removing a shortcut by drag) -->
    <div class="toast" id="toast" role="status" hidden></div>

    <!-- SECTION / SHORTCUT CONTEXT MENU -->
    <div class="ctx" id="ctxMenu" role="menu" hidden></div>

    <!-- ADD / EDIT DIALOG -->
    <div class="ed" id="editDialog" hidden>
      <div class="ed-backdrop" id="editBackdrop"></div>
      <div class="ed-panel" role="dialog" aria-modal="true" aria-labelledby="editTitle">
        <form id="editForm" autocomplete="off">
          <div class="ed-head" id="editTitle">Edit</div>
          <div class="ed-body" id="editFields"></div>
          <p class="ed-error" id="editError" role="alert" hidden></p>
          <div class="ed-foot">
            <button type="button" class="ed-btn" id="editCancel">Cancel</button>
            <button type="submit" class="ed-btn is-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- COMMAND CENTER -->
    <div class="cc" id="cc" hidden>
      <div class="cc-backdrop" id="ccBackdrop"></div>
      <div
        class="cc-panel"
        role="dialog"
        aria-modal="true"
        aria-label="Command Center"
        id="ccPanel"
      >
        <div class="cc-field">
          <span class="cc-glyph" aria-hidden="true">&#10022;</span>
          <input
            id="ccInput"
            class="cc-input"
            type="text"
            placeholder="What do you want to do?"
            aria-label="Search commands"
            role="combobox"
            aria-expanded="true"
            aria-controls="ccList"
            aria-autocomplete="list"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="cc-esc" aria-hidden="true">Esc</kbd>
        </div>
        <div class="cc-results" id="ccResults">
          <ul class="cc-list" id="ccList" role="listbox" aria-label="Commands"></ul>
          <div class="cc-empty" id="ccEmpty" hidden>No commands found</div>
        </div>
        <div class="cc-foot">
          <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> Navigate</span>
          <span><kbd>&#8629;</kbd> Open</span>
          <span><kbd>Esc</kbd> Close</span>
        </div>
      </div>
    </div>

    <!-- AI CHAT -->
    <div class="ai" id="ai">
      <button class="ai-bubble" id="aiToggle" aria-label="Open assistant">✦</button>
      <div class="ai-panel" id="aiPanel" role="dialog" aria-label="Assistant" hidden>
        <div class="ai-head">
          <span class="ai-avatar" aria-hidden="true">&#10022;</span>
          <span class="ai-who">
            <span class="ai-name">Atlas</span>
            <span class="ai-status" id="aiStatus"><i aria-hidden="true"></i><span id="aiStatusText">Online</span></span>
          </span>
          <button type="button" class="ai-icon-btn" id="aiTalk" aria-pressed="false" aria-label="Talk mode" title="Talk mode — speak and hear answers" hidden>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
          </button>
          <button type="button" class="ai-icon-btn" id="aiVoice" aria-haspopup="dialog" aria-expanded="false" aria-label="Voice and language" title="Voice and language" hidden>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          </button>
          <button type="button" class="ai-icon-btn" id="aiClear" aria-label="Clear chat" title="Clear chat">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 12h9l1-12"/></svg>
          </button>
          <button type="button" class="ai-icon-btn" id="aiClose" aria-label="Close assistant" title="Close">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="ai-log" id="aiLog" role="log" aria-live="polite"></div>
        <form class="ai-form" id="aiForm">
          <div class="ai-field">
            <textarea id="aiInput" rows="1" placeholder="Ask Atlas anything&hellip;" aria-label="Message assistant"></textarea>
            <button type="button" class="ai-mic" id="aiMic" aria-pressed="false" aria-label="Voice typing" title="Voice typing" hidden>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
            </button>
            <button type="submit" class="ai-send" id="aiSend" aria-label="Send">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
          <div class="ai-hint" id="aiHint">Enter to send &middot; Shift + Enter for a new line</div>
        </form>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="languages.js"></script>
    <script src="voice.js"></script>
    <script src="cursors.js"></script>
    <script src="schedule.js"></script>
    <script src="sounds.js"></script>
    <script src="vault.js"></script>
    <script src="account.js"></script>
    <script src="sync.js"></script>
    <script src="customize.js"></script>
    <script src="premium.js"></script>
    <script src="app.js"></script>
    <script src="reminders.js"></script>
    <script src="zen.js"></script>
    <script src="minimal.js"></script>
    <script src="quote.js"></script>
    <script src="focus.js"></script>
    <script src="quicktools.js"></script>
    <script src="stats.js"></script>
    <script src="translate.js"></script>
  </body>
</html>
