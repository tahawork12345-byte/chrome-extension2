<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked</title>
    <style>
      :root { color-scheme: dark; --accent: #d8c3a5; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: radial-gradient(90% 70% at 50% 0%, #1f1d24, #0d0d11); color: #f7f6f3; font: 15px/1.55 system-ui, sans-serif; }
      main { width: min(460px, 100%); padding: 36px 30px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px; background: rgba(255, 255, 255, 0.04); box-shadow: 0 30px 80px -40px #000; }
      .icon { width: 54px; height: 54px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%;
        background: rgba(216, 195, 165, 0.14); color: var(--accent); }
      h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
      .site { margin: 0 0 16px; color: var(--accent); font-weight: 600; word-break: break-all; }
      .msg { margin: 0 0 22px; color: rgba(247, 246, 243, 0.72); white-space: pre-wrap; }
      .until { margin: -10px 0 22px; font-size: 13px; color: rgba(247, 246, 243, 0.55); }
      .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      button { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16); background: transparent;
        color: #f7f6f3; font: inherit; font-size: 14px; cursor: pointer; }
      button:hover { background: rgba(255, 255, 255, 0.08); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #121216; font-weight: 600; }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>
      </div>
      <h1>This site is blocked</h1>
      <p class="site" id="site"></p>
      <p class="msg" id="msg">Stay focused — it'll still be there later.</p>
      <p class="until" id="until" hidden></p>
      <div class="btns">
        <button type="button" class="primary" id="home">Open a new tab</button>
        <button type="button" id="break" hidden>Take a 5-minute break</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
