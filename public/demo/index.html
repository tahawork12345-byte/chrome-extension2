<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- LIVE WALLPAPER (two layers for crossfade) -->
    <div class="wallpaper">
      <video class="wp-layer is-active" id="videoA" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <video class="wp-layer" id="videoB" muted loop playsinline preload="auto" disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <div class="wp-veil"></div>
    </div>

    <main class="stage">
      <!-- CLOCK -->
      <header class="clock">
        <div class="clock-time"><span id="time">--:--</span><span class="meridiem" id="meridiem">AM</span></div>
        <div class="clock-date" id="date"></div>
      </header>

      <!-- WORKSPACE STRIP -->
      <nav class="strip" id="strip" aria-label="Workspaces"></nav>

      <!-- FOUR CARDS -->
      <section class="grid" id="grid"></section>

      <!-- SEARCH -->
      <form class="search" id="search" autocomplete="off">
        <span class="search-glyph" aria-hidden="true">◌</span>
        <input id="q" type="text" placeholder="Search Google..." aria-label="Search Google" />
        <button type="submit" class="search-go" aria-label="Search">↵</button>
      </form>
    </main>

    <!-- WALLPAPER CONTROL -->
    <div class="wp-control" id="wpControl">
      <button class="wp-toggle" id="wpToggle" aria-label="Change wallpaper">◑</button>
      <div class="wp-menu" id="wpMenu" hidden></div>
    </div>

    <!-- QUICK PEEK -->
    <div class="peek" id="peek">
      <button class="peek-toggle" id="peekToggle">Quick Peek</button>
      <div class="peek-panel" id="peekPanel" hidden></div>
    </div>

    <!-- AI CHAT -->
    <div class="ai" id="ai">
      <button class="ai-bubble" id="aiToggle" aria-label="Open assistant">✦</button>
      <div class="ai-panel" id="aiPanel" hidden>
        <div class="ai-head">
          <span>Assistant</span>
          <button class="ai-close" id="aiClose" aria-label="Close assistant">✕</button>
        </div>
        <div class="ai-log" id="aiLog"></div>
        <form class="ai-form" id="aiForm">
          <input id="aiInput" type="text" placeholder="Message..." aria-label="Message assistant" />
          <button type="submit" aria-label="Send">→</button>
        </form>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
      /* the wallpaper can't be right-clicked to save or dragged out */
      document.addEventListener("contextmenu", (e) => { if (e.target instanceof Element && e.target.closest(".wallpaper, video, img")) e.preventDefault(); });
      document.addEventListener("dragstart", (e) => { if (e.target instanceof Element && e.target.matches("img, video")) e.preventDefault(); });
    </script>
  </body>
</html>
